<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - AI Auto Agent</title>
    <script src="js/3.4.17.js"></script>
    <link rel="stylesheet" href="css/css2.css">
    <script src="js/auth.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-white text-slate-900 font-sans">
<div class="min-h-screen flex">
    <section class="hidden lg:flex w-1/2 border-r border-slate-100 bg-slate-50/60 p-12 flex-col justify-between">
        <div class="flex items-center gap-3">
            <div class="h-10 w-10 rounded-2xl bg-slate-900 text-white flex items-center justify-center text-lg font-semibold">A</div>
            <div>
                <div class="text-sm font-semibold tracking-wide text-slate-900">AI Auto Agent</div>
                <div class="text-xs text-slate-500">Enterprise Console</div>
            </div>
        </div>

        <div class="max-w-md">
            <p class="text-sm font-medium text-slate-500 mb-4">CODING AGENT</p>
            <h1 class="text-4xl font-semibold leading-tight tracking-tight text-slate-950">统一登录入口</h1>
            <p class="mt-5 text-base leading-7 text-slate-500">使用企业账号进入智能体工作台。登录后系统会为当前会话签发 JWT，并自动携带到后续 API 请求中。</p>
            <div class="mt-8 grid grid-cols-3 gap-3 text-sm">
                <div class="rounded-2xl border border-slate-200 bg-white p-4">
                    <div class="font-semibold text-slate-900">JWT</div>
                    <div class="mt-1 text-xs text-slate-500">无状态鉴权</div>
                </div>
                <div class="rounded-2xl border border-slate-200 bg-white p-4">
                    <div class="font-semibold text-slate-900">MySQL</div>
                    <div class="mt-1 text-xs text-slate-500">用户身份存储</div>
                </div>
                <div class="rounded-2xl border border-slate-200 bg-white p-4">
                    <div class="font-semibold text-slate-900">Agent</div>
                    <div class="mt-1 text-xs text-slate-500">登录后访问</div>
                </div>
            </div>
        </div>

        <div class="text-xs text-slate-400">© 2026 AI Auto Agent. Secure access for agent workspace.</div>
    </section>

    <main class="flex-1 flex items-center justify-center px-6 py-10">
        <div class="w-full max-w-sm">
            <div class="lg:hidden mb-10 flex items-center gap-3 justify-center">
                <div class="h-10 w-10 rounded-2xl bg-slate-900 text-white flex items-center justify-center text-lg font-semibold">A</div>
                <div>
                    <div class="text-sm font-semibold tracking-wide text-slate-900">AI Auto Agent</div>
                    <div class="text-xs text-slate-500">Enterprise Console</div>
                </div>
            </div>

            <div class="mb-8 text-center lg:text-left">
                <h2 class="text-2xl font-semibold tracking-tight text-slate-950">欢迎回来</h2>
                <p class="mt-2 text-sm text-slate-500">请输入账号密码登录智能体工作台</p>
            </div>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700 mb-2">账号</label>
                    <input id="username" name="username" type="text" autocomplete="username" placeholder="请输入账号" required
                           class="w-full h-11 rounded-xl border border-slate-200 bg-white px-4 text-sm text-slate-900 outline-none transition focus:border-slate-900 focus:ring-4 focus:ring-slate-100">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label for="password" class="block text-sm font-medium text-slate-700">密码</label>
                        <button id="togglePassword" type="button" class="text-xs text-slate-500 hover:text-slate-900">显示</button>
                    </div>
                    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required
                           class="w-full h-11 rounded-xl border border-slate-200 bg-white px-4 text-sm text-slate-900 outline-none transition focus:border-slate-900 focus:ring-4 focus:ring-slate-100">
                </div>

                <div id="errorBox" class="hidden rounded-xl border border-red-100 bg-red-50 px-4 py-3 text-sm text-red-600"></div>

                <button id="loginButton" type="submit"
                        class="w-full h-11 rounded-xl bg-slate-900 text-white text-sm font-medium transition hover:bg-slate-800 disabled:cursor-not-allowed disabled:bg-slate-300">
                    登录
                </button>
            </form>

            <div class="mt-6 rounded-2xl border border-slate-100 bg-slate-50 px-4 py-3 text-xs leading-6 text-slate-500">
                <div class="font-medium text-slate-700">开发测试账号</div>
                <div>账号：admin</div>
                <div>密码：admin123456</div>
            </div>
        </div>
    </main>
</div>

<script>
    const LOGIN_API = "/api/v1/chat/user/login";
    const TOKEN_KEY = "coding_agent_token";
    const USER_KEY = "coding_agent_user";

    const form = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const errorBox = document.getElementById("errorBox");
    const loginButton = document.getElementById("loginButton");
    const togglePassword = document.getElementById("togglePassword");

    function showError(message) {
        errorBox.textContent = message || "登录失败，请稍后重试";
        errorBox.classList.remove("hidden");
    }

    function hideError() {
        errorBox.classList.add("hidden");
        errorBox.textContent = "";
    }

    function getRedirectUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get("redirect") || "index.html";
    }

    togglePassword.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        togglePassword.textContent = isPassword ? "隐藏" : "显示";
    });

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        hideError();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (!username || !password) {
            showError("请输入账号和密码");
            return;
        }

        loginButton.disabled = true;
        loginButton.textContent = "登录中...";

        try {
            const response = await fetch(LOGIN_API, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });

            const result = await response.json();
            if (!response.ok || result.code !== "0000" || !result.data || !result.data.token) {
                showError(result.info || "账号或密码错误");
                return;
            }

            const data = result.data;
            const user = data.user || {
                userId: data.userId,
                tenantId: data.tenantId,
                username: data.username,
                nickname: data.nickname,
                roleCode: data.roleCode
            };

            localStorage.setItem(TOKEN_KEY, data.token);
            localStorage.setItem(USER_KEY, JSON.stringify(user));
            window.location.href = getRedirectUrl();
        } catch (error) {
            console.error("login failed", error);
            showError("无法连接登录服务，请确认后端已启动");
        } finally {
            loginButton.disabled = false;
            loginButton.textContent = "登录";
        }
    });
</script>
</body>
</html>
