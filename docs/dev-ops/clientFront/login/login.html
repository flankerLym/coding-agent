<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - AI Auto Agent</title>
    <link rel="stylesheet" href="css/login.css">
    <script src="js/auth.js"></script>
</head>
<body>
<div class="login-shell">
    <section class="brand-panel">
        <div class="brand-head">
            <div class="brand-logo">A</div>
            <div>
                <div class="brand-title">AI Auto Agent</div>
                <div class="brand-subtitle">Enterprise Console</div>
            </div>
        </div>

        <div class="brand-main">
            <div class="eyebrow">CODING AGENT</div>
            <h1>统一登录入口</h1>
            <p>使用企业账号进入智能体工作台。登录后系统会为当前会话签发 JWT，并自动携带到后续 API 请求中。</p>

            <div class="feature-grid">
                <div class="feature-card">
                    <strong>JWT</strong>
                    <span>无状态鉴权</span>
                </div>
                <div class="feature-card">
                    <strong>MySQL</strong>
                    <span>用户身份存储</span>
                </div>
                <div class="feature-card">
                    <strong>Agent</strong>
                    <span>登录后访问</span>
                </div>
            </div>
        </div>

        <div class="copyright">© 2026 AI Auto Agent. Secure access for agent workspace.</div>
    </section>

    <main class="form-panel">
        <div class="form-card">
            <div class="mobile-brand">
                <div class="brand-logo">A</div>
                <div>
                    <div class="brand-title">AI Auto Agent</div>
                    <div class="brand-subtitle">Enterprise Console</div>
                </div>
            </div>

            <div class="form-title">
                <h2>欢迎回来</h2>
                <p>请输入账号密码登录智能体工作台</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-item">
                    <label for="username">账号</label>
                    <input id="username" name="username" type="text" autocomplete="username" placeholder="请输入账号" required>
                </div>

                <div class="form-item">
                    <div class="label-row">
                        <label for="password">密码</label>
                        <button id="togglePassword" type="button" class="link-button">显示</button>
                    </div>
                    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
                </div>

                <div id="errorBox" class="error-box hidden"></div>

                <button id="loginButton" type="submit" class="submit-button">登录</button>
            </form>

            <div class="dev-account">
                <div class="dev-title">开发测试账号</div>
                <div>账号：admin</div>
                <div>密码：admin123456</div>
            </div>
        </div>
    </main>
</div>

<script>
    const LOGIN_API = "/api/v1/chat/user/login";
    const TOKEN_KEY = "coding_agent_token";
    const USER_KEY = "coding_agent_user";

    const form = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const errorBox = document.getElementById("errorBox");
    const loginButton = document.getElementById("loginButton");
    const togglePassword = document.getElementById("togglePassword");

    function showError(message) {
        errorBox.textContent = message || "登录失败，请稍后重试";
        errorBox.classList.remove("hidden");
    }

    function hideError() {
        errorBox.classList.add("hidden");
        errorBox.textContent = "";
    }

    function getRedirectUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get("redirect") || "../chatIndex/index.html";
    }

    togglePassword.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        togglePassword.textContent = isPassword ? "隐藏" : "显示";
    });

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        hideError();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (!username || !password) {
            showError("请输入账号和密码");
            return;
        }

        loginButton.disabled = true;
        loginButton.textContent = "登录中...";

        try {
            const response = await fetch(LOGIN_API, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });

            const result = await response.json();
            if (!response.ok || result.code !== "0000" || !result.data || !result.data.token) {
                showError(result.info || "账号或密码错误");
                return;
            }

            const data = result.data;
            const user = data.user || {
                userId: data.userId,
                tenantId: data.tenantId,
                username: data.username,
                nickname: data.nickname,
                roleCode: data.roleCode
            };

            localStorage.setItem(TOKEN_KEY, data.token);
            localStorage.setItem(USER_KEY, JSON.stringify(user));
            window.location.href = getRedirectUrl();
        } catch (error) {
            console.error("login failed", error);
            showError("无法连接登录服务，请确认后端已启动");
        } finally {
            loginButton.disabled = false;
            loginButton.textContent = "登录";
        }
    });
</script>
</body>
</html>
