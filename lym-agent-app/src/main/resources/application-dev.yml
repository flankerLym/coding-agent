server:
  port: 8091

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy
# 数据库配置；启动时配置数据库资源信息
spring:
  datasource:
    mysql:
      username: root
      password: 140810921
      url: jdbc:mysql://175.178.182.172:13306/ai-agent-station-study?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=true
      driver-class-name: com.mysql.cj.jdbc.Driver
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        pool-name: Retail_HikariCP
        minimum-idle: 15 #最小空闲连接数量
        idle-timeout: 180000 #空闲连接存活最大时间，默认600000（10分钟）
        keepalive-time: 30000
        maximum-pool-size: 25 #连接池最大连接数，默认是10
        auto-commit: true  #此属性控制从池返回的连接的默认自动提交行为,默认值：true
        max-lifetime: 1800000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
        connection-timeout: 30000 #数据库连接超时时间,默认30秒，即30000
        connection-test-query: SELECT 1
    pgvector:
      driver-class-name: org.postgresql.Driver
      username: root
      password: 140810921
      url: jdbc:postgresql://175.178.182.172:5432/springai
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        maximum-pool-size: 5
        minimum-idle: 2
        idle-timeout: 30000
        connection-timeout: 30000
  ai:
    zhipuai:
      api-key: ee47e5200a65463181b692571a4da7f8.dRETn3mDdI1voRD3
      embedding:
        options:
          model: embedding-3
    agent:
      auto-config:
        enabled: true
        client-ids: 3101,3102,3103,3104
    model:
      chat: none
      embedding: zhipuai
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none

# 日志
logging:
  level:
    root: info
    org.springframework.web.client: TRACE
    org.springframework.ai: TRACE
    org.apache.http: DEBUG  # 如果使用 HttpClient
  config: classpath:logback-spring.xml
