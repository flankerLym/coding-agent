server:
  port: 8099

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy
# 数据库配置；启动时配置数据库资源信息
spring:
  data:
    redis:
      host: 175.178.182.172
      port: 16379
      database: 0
      timeout: 100s
  datasource:
    mysql:
      username: root
      password: 140810921
      url: jdbc:mysql://175.178.182.172:13306/ai-agent-station-study?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=true
      driver-class-name: com.mysql.cj.jdbc.Driver
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        pool-name: Retail_HikariCP
        minimum-idle: 15 #最小空闲连接数量
        idle-timeout: 180000 #空闲连接存活最大时间，默认600000（10分钟）
        keepalive-time: 30000
        maximum-pool-size: 25 #连接池最大连接数，默认是10
        auto-commit: true  #此属性控制从池返回的连接的默认自动提交行为,默认值：true
        max-lifetime: 1800000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
        connection-timeout: 30000 #数据库连接超时时间,默认30秒，即30000
        connection-test-query: SELECT 1
    pgvector:
      driver-class-name: org.postgresql.Driver
      username: root
      password: 140810921
      url: jdbc:postgresql://175.178.182.172:5432/springai
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        maximum-pool-size: 5
        minimum-idle: 2
        idle-timeout: 30000
        connection-timeout: 30000
    neo4j:
      uri: bolt://175.178.182.172:7687
      authentication:
        username: neo4j
        password: 140810921
      pool:
        max-connection-pool-size: 30
        connection-acquisition-timeout: 10s
        max-connection-lifetime: 30m
        idle-time-before-connection-test: 30s
        log-leaked-sessions: true
        metrics-enabled: true
  ai:
    zhipuai:
      api-key: ee47e5200a65463181b692571a4da7f8.dRETn3mDdI1voRD3
      embedding:
        options:
          model: embedding-3
          dimensions: 1024
    agent:
      auto-config:
        enabled: true
#        client-ids: 3101,3102,3103,3104
        fixed-mcp: false
    model:
      chat: none
      embedding: zhipuai
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
legal:
  web-code-search:
    cache-seconds: 3600
    max-page-size-bytes: 5242880
    documents:
      criminal_law:
        name: 中华人民共和国刑法
        url: https://www.fadada.com/article/Basics-020739
        enabled: true
      civil_code:
        name: 中华人民共和国民法典
        url: https://www.sdcourt.gov.cn/lcgtfy/374994/374995/6120123/index.html
        enabled: true

      civil_procedure_law:
        name: 中华人民共和国民事诉讼法
        url: https://jiangsu.chinatax.gov.cn/art/2023/9/1/art_23636_1028.html
        enabled: true

      labor_contract_law:
        name: 中华人民共和国劳动合同法
        url: https://rst.hunan.gov.cn/rst/zcfl/202211/t20221110_29121875.html
        enabled: true
# 日志
logging:
  level:
    root: info
    org.springframework.web.client: TRACE
    org.springframework.ai: TRACE
    org.apache.http: DEBUG  # 如果使用 HttpClient
  config: classpath:logback-spring.xml
